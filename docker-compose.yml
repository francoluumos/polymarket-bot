services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost: research notebooks connect via SSH tunnel on the VPS.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 512mb

  migrate:
    image: timescale/timescaledb:2.17.2-pg16
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: timescaledb
    volumes:
      - ./storage:/storage:ro
    entrypoint: ["/bin/sh", "/storage/migrate.sh"]
    restart: "no"

  binance-collector:
    build:
      context: .
      dockerfile: collectors/Dockerfile
    command: ["python", "-m", "collectors.binance_ws"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: timescaledb
      DB_PORT: "5432"
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT}
      OI_POLL_INTERVAL: ${OI_POLL_INTERVAL:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  timescale_data:
